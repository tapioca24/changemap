name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validate:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24.11.0"
      - name: Validate release tag and commit
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          node scripts/check-release.mjs "$RELEASE_TAG"

  check:
    needs: validate
    uses: ./.github/workflows/ci.yml

  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.11.0"
      - run: pnpm install --frozen-lockfile
      - name: Validate and save the package tarball
        env:
          CHANGEMAP_PACK_OUTPUT_DIR: ${{ runner.temp }}/changemap-package
        run: pnpm test:pack
      - name: Publish the validated tarball
        run: npm publish "$RUNNER_TEMP"/changemap-package/*.tgz --access public --registry https://registry.npmjs.org
      - name: Show published version
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          echo "Published changemap@$VERSION to npm." >> "$GITHUB_STEP_SUMMARY"
          echo "Package: https://www.npmjs.com/package/changemap/v/$VERSION" >> "$GITHUB_STEP_SUMMARY"
      - name: Show failure
        if: ${{ failure() }}
        run: echo "npm publication failed. Check the publish job logs." >> "$GITHUB_STEP_SUMMARY"
